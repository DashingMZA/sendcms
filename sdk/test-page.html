<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SendCMS SDK — test page</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
      label { display: block; margin-bottom: 12px; }
      input, textarea { display: block; width: 100%; margin-top: 4px; padding: 8px; }
      button { padding: 10px 18px; cursor: pointer; }
      hr { margin: 32px 0; }
    </style>
  </head>
  <body>
    <h1>SendCMS SDK test page</h1>
    <p>
      Replace <code>__USER_ID__</code> / <code>__FORM_ID__</code> with a
      real form's public ids, serve this page from a linked verified
      domain, and submit the form. The SDK status message appears under
      the button.
    </p>

    <!-- SDK-enhanced form (JavaScript) -->
    <script src="/forms/v1.js" data-user-id="__USER_ID__" data-form-id="__FORM_ID__"></script>
    <form data-cms-form>
      <label>Name
        <input type="text" name="name" required>
      </label>
      <label>Email
        <input type="email" name="email" required>
      </label>
      <label>Message
        <textarea name="message" required></textarea>
      </label>
      <button type="submit">Send (SDK)</button>
    </form>

    <hr>

    <h2>No-JS fallback</h2>
    <p>Same endpoint, plain HTML POST — no JavaScript involved.</p>
    <form action="/api/public/v1/submit" method="POST">
      <input type="hidden" name="userId" value="__USER_ID__">
      <input type="hidden" name="formId" value="__FORM_ID__">
      <label>Name
        <input type="text" name="name" required>
      </label>
      <label>Email
        <input type="email" name="email" required>
      </label>
      <label>Message
        <textarea name="message" required></textarea>
      </label>
      <button type="submit">Send (no-JS)</button>
    </form>
  </body>
</html>
