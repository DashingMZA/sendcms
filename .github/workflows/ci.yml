name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma client output (generated/prisma) is gitignored, so a fresh
      # checkout has no client until it is generated. typecheck/lint/test
      # all import it, so generate before any of them (build does it too,
      # via its own script, but it runs last).
      - run: pnpm db:generate
      # The SDK bundle (public/forms/v1.js) is gitignored too, and the
      # SDK tests load the real built bundle — build it before testing.
      - run: pnpm sdk:build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/sendcms?sslmode=require
          BETTER_AUTH_SECRET: dummy-build-secret-32-chars-long-xxxx
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          WIDGET_JWT_SECRET: dummy-widget-secret-build-only-xxx
          NEXT_PUBLIC_APP_URL: http://localhost:3000
